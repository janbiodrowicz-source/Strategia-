<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Strategia — mini-RTS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="menu">
    <div class="panel">
      <h1>Strategia</h1>
      <p class="subtitle">mini-RTS w przeglądarce</p>

      <fieldset>
        <legend>Rasa</legend>
        <label><input type="radio" name="race" value="forest" checked> 🌲 Strażnicy Puszczy</label>
        <label><input type="radio" name="race" value="iron"> 🪨 Żelazny Zakon</label>
      </fieldset>

      <fieldset>
        <legend>Runda</legend>
        <label><input type="radio" name="round" value="1" checked> 1 — mała mapa, ochrona 10 min, bez mgły</label>
        <label><input type="radio" name="round" value="2"> 2 — średnia mapa, ochrona 20 min, bez mgły</label>
        <label><input type="radio" name="round" value="3"> 3 — duża mapa, ochrona 30 min, mgła wojny</label>
      </fieldset>

      <fieldset>
        <legend>Poziom AI</legend>
        <label><input type="radio" name="difficulty" value="easy"> Łatwy</label>
        <label><input type="radio" name="difficulty" value="medium" checked> Średni</label>
        <label><input type="radio" name="difficulty" value="hard"> Trudny</label>
      </fieldset>

      <button id="start-btn">Graj ▶</button>
    </div>
  </div>

  <div id="hud" hidden>
    <div id="toast" hidden></div>
    <div id="endscreen" hidden>
      <div class="panel">
        <h2></h2>
        <p></p>
        <button onclick="location.reload()">Zagraj ponownie ↻</button>
      </div>
    </div>
    <div id="topbar">
      <span title="Drewno">🪵 <b id="res-wood">0</b></span>
      <span title="Kamień">🪨 <b id="res-stone">0</b></span>
      <span title="Złoto">🪙 <b id="res-gold">0</b></span>
      <span title="Populacja">👥 <b id="res-pop">0/0</b></span>
      <span id="protection"></span>
      <span id="round-label"></span>
    </div>
    <div id="bottombar">
      <canvas id="minimap" width="200" height="200"></canvas>
      <div id="sidepanel">
        <div id="touchbar">
          <button data-action="box" title="Zaznacz obszarem">▢<span>Obszar</span></button>
          <button data-action="add" title="Dodawaj do zaznaczenia">➕<span>Dodaj</span></button>
          <button data-action="workers" title="Zaznacz robotników">⛏️<span>Robotnicy</span></button>
          <button data-action="all" title="Zaznacz wszystkie">👥<span>Wszyscy</span></button>
          <button data-action="none" title="Odznacz">✖<span>Odznacz</span></button>
          <button data-action="base" title="Kamera na bazę">🏠<span>Baza</span></button>
        </div>
        <div id="selection">
          <div id="selection-info"></div>
          <div id="actions" hidden></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/balans-data.js"></script>
  <script src="js/balans.js"></script>
  <script src="js/map.js"></script>
  <script src="js/pathfinding.js"></script>
  <script src="js/units.js"></script>
  <script src="js/fog.js"></script>
  <script src="js/economy.js"></script>
  <script src="js/buildings.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/render.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
